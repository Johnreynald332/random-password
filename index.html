<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Password Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="container">
        <h1>Random Password Generator</h1>
        <div id="password-display">
            <input type="text" id="password" readonly>
        </div>
        <div id="options">
            <label for="length">Length:</label>
            <input type="number" id="length" min="4" max="10">
            <label><input type="checkbox" id="include-uppercase"> Include Uppercase</label>
            <label><input type="checkbox" id="include-lowercase" checked> Include Lowercase</label>
            <label><input type="checkbox" id="include-numbers"> Include Numbers</label>
            <label><input type="checkbox" id="include-symbols"> Include Symbols</label>
        </div>
        <button id="generate-btn">Generate Password</button>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
